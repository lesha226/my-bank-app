logging.level.org.springframework.security: DEBUG
logging.level.org.springframework.web: DEBUG

spring:
  application:
    name: cash
  cloud:
    config:
      discovery:
        enabled: true
        serviceId: spring-cloud-config-server

server:
  port: 8086

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
