bank:
  service:
    accounts:
      base-url: http://localhost:8085/api/v1

spring:
  main:
    allow-bean-definition-overriding: true
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          enabled: false
      client:
        enabled: false

eureka:
  client:
    enabled: false