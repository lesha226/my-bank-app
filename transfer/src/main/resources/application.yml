logging.level.org.springframework.security: DEBUG
logging.level.org.springframework.web: DEBUG

spring:
  application:
    name: transfer
  cloud:
    config:
      discovery:
        enabled: true
        serviceId: spring-cloud-config-server
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_KEYCLOAK_REALM_URL:http://localhost:8180/realms/bank-realm}
      client:
        registration:
          transfer-service:
            provider: keycloak
            client-id: transfer-service
            client-secret: transfer-service-secret
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            issuer-uri: ${SPRING_KEYCLOAK_REALM_URL:http://localhost:8180/realms/bank-realm}
            #user-name-attribute: preferred_username

server:
  port: 8087

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}