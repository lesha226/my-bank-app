spring:
  application:
    name: accounts
  #config:
    #import: configserver:${SPRING_CONFIG_URL:http://127.0.0.1:8888}
  cloud:
    config:
      discovery:
        enabled: true
        serviceId: spring-cloud-config-server

server:
  port: 8085

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

# PostgreSQL configuration
spring.datasource:
  url: ${DB_URL:jdbc:postgresql://localhost:5432/my_bank?currentSchema=accounts_schema}
  username: ${DB_USER:postgres}
  password: ${DB_PASSWORD:password}
  driver-class-name: org.postgresql.Driver