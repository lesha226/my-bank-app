services:
  front-ui:
    build: ./front-ui
    container_name: my-bank-front-ui
    #restart: on-failure
    environment:
      SPRING_KEYCLOAK_ISSUER_URI: http://keycloak:8180/realms/bank-realm
    ports:
      - "8080:8080"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 1s
      retries: 5
    networks:
      - my-bank-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: my-bank-keycloak
    command:
      - start-dev
      - --http-port=8180
      - --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: localhost
      KC_HEALTH_ENABLED: true
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import
    networks:
      - my-bank-network
    healthcheck:
      test: ["CMD-SHELL", "curl --head -fsS http://localhost:8180/health/ready | echo $?"]
      interval: 5s
      timeout: 1s
      retries: 5
      start_period: 60s

networks:
  my-bank-network:
    driver: bridge