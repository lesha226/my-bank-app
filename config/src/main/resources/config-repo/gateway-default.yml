spring:
  cloud:
    #discovery:
      #client:
        #simple:
          #instances:
            #accounts-service: # Мы не используем Service Discovery, поэтому перечислим хосты самостоятельно
              #- uri: http://localhost:8085
    gateway:
      server:
        webflux:
          routes:
            - id: accounts-route  # ID роута
              #uri: lb://accounts-service  # URI микросервиса, на который следует перенаправлять запрос
              #uri: http://localhost:8085
              uri: lb://accounts
              predicates:
                - Path=/accounts/** # URI поступающего в Gateway запроса, с которым мэтчится роут
              filters:
                - RewritePath=/accounts/?(?<segment>.*), /$\{segment} # Фильтр, который модифицирует запрос к целевому сервису (убирается имя сервиса в начале)

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}